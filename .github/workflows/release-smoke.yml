name: Release smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install release gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Canonical dataforge release gate
        run: python -m dataforge.release.gate --json

      - name: Build MCP smoke wheels
        run: |
          python -m build --wheel --outdir dist
          python -m build dataforge-mcp --wheel --outdir dist

      - name: Installed MCP stdio smoke
        run: |
          python -m venv .release-smoke
          # Install the built wheel files directly rather than resolving `dataforge_07_mcp` by
          # name: both pyproject.toml files are versioned 0.1.0, and PyPI already hosts the
          # 2026-06-03 0.1.0 wheels (which predate `dataforge.ui.trust_vocab`). Resolving by
          # package name lets pip satisfy `dataforge_07>=0.1.0` from PyPI/cache, causing
          # `dataforge-mcp serve` to crash at import time with `MCPError: Connection closed`.
          timeout 60 .release-smoke/bin/python -m pip install --find-links dist dist/dataforge_07-*.whl dist/dataforge_07_mcp-*.whl
          PATH="$PWD/.release-smoke/bin:$PATH" .release-smoke/bin/python scripts/ci/installed_package_smoke.py --package dataforge_07_mcp
